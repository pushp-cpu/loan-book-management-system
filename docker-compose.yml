services:
  postgres:
    image: postgres:16
    container_name: loanbook-postgres
    environment:
      POSTGRES_DB: loanbook_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - loanbook_data:/var/lib/postgresql/data
volumes:
  loanbook_data:
